# DACON AI Agent 행동 예측 프로젝트 기본 설정 파일
#
# 이 파일은 아직 실제 학습에 사용된 설정이 아닙니다.
# 앞으로 baseline, feature engineering, model tuning을 진행하면서
# 실험별 설정을 복사하거나 확장해 사용합니다.

project:
  name: AI-Agent-Dacon-2026
  stage: initial_template

paths:
  raw_data_dir: data/raw
  interim_data_dir: data/interim
  processed_data_dir: data/processed
  train_jsonl: data/raw/train.jsonl
  train_labels: data/raw/train_labels.csv
  test_jsonl: data/raw/test.jsonl
  sample_submission: data/raw/sample_submission.csv
  output_dir: results/submissions
  figure_dir: results/figures
  model_dir: models
  log_dir: logs

experiment:
  seed: 42
  validation_strategy: TBD
  metric: TBD

features:
  use_current_prompt: true
  use_history_text: true
  use_history_actions: true
  use_session_meta: true
  use_workspace_meta: true

model:
  name: TBD
  params: {}

submission:
  filename: submission.csv
